<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="安値世界一">
  <meta name="description" content="楽天市場・Amazon・Yahoo!ショッピング・公式ショップの同じ製品を、キャンペーン・ポイント還元・クーポンを差し引いた実質価格で比べ、最安値を判定する個人用アプリ。">
  <title>安値世界一</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#compare" aria-label="安値世界一 比較"><img src="./icon.svg" alt="" width="32" height="32"><span><b>安値世界一</b><small>実質価格で最安値を判定</small></span></a>
      <nav class="tabs" aria-label="メニュー">
        <a href="#compare" data-tab="compare"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><span>比較</span></a>
        <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>還元設定</span></a>
        <a href="#help" data-tab="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.6v.2"/></svg><span>使い方</span></a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap"><p class="muted">読み込み中…</p></main>
  <input type="file" id="file-import" class="picker" accept="application/json,.json">
  <dialog id="dlg"><button type="button" class="x" aria-label="閉じる">×</button><div id="dlg-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
