name: Refresh club activity

on:
  schedule:
    - cron: '41 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-source-data
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch provider data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_REQUEST_BUDGET: ${{ vars.API_FOOTBALL_REQUEST_BUDGET }}
        run: python3 scripts/update_clubs.py
      - name: Save updated reports
        run: |
          if [ ! -f data/clubs.json ]; then
            exit 0
          fi
          git add -- data/clubs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh club activity data'
          git pull --rebase
          git push
