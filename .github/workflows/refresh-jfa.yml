name: Refresh Japan fixtures and call-ups

on:
  schedule:
    # 1日3回（日本時間 6:47 / 12:47 / 18:47）
    - cron: "47 21,3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-source-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        run: |
          jfa_status=0
          ranking_status=0
          python scripts/refresh_jfa.py || jfa_status=$?
          python scripts/update_ranking.py || ranking_status=$?
          python scripts/update_jfa_profiles.py || true
          python scripts/update_fpl.py || echo "FPL refresh failed; previous data kept."
          python scripts/update_injury_news.py || echo "Injury news refresh failed; previous data kept."
          if ((jfa_status != 0 && ranking_status != 0)); then
            exit 1
          fi
      - name: Save refreshed records
        run: |
          git add -- data/jfa.json data/ranking.json data/jfa-profiles.json data/fpl.json data/injury-news.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Japan fixtures, call-ups, ranking and injury news'
          git pull --rebase
          git push
