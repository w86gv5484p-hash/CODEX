name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh Japan fixtures and call-ups, Refresh club activity, Refresh player portraits, Refresh NSX parts supply]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      (github.event_name != 'workflow_run' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Collect static application
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          for path in *.css *.js *.webmanifest robots.txt assets data nsx fern family; do
            if [[ -e "$path" ]]; then
              cp -R -- "$path" _site/
            fi
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
