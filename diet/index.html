<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="減量プラン">
  <meta name="description" content="目標体重・現在の体重・目標日から必要なカロリー赤字を計算し、運動・食事・その他（歩数・睡眠・生活習慣）に連動して配分する個人用の減量アプリ。食べたものから次の食事を自炊・コンビニ・外食で提案します。">
  <title>減量プラン</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#goal" aria-label="減量プラン 目標"><img src="./icon.svg" alt="" width="32" height="32"><span><b>減量プラン</b><small>運動・食事・生活習慣を連動</small></span></a>
      <nav class="tabs" aria-label="メニュー">
        <a href="#goal" data-tab="goal"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/></svg><span>目標</span></a>
        <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>配分</span></a>
        <a href="#meals" data-tab="meals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0ZM8 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg><span>食事</span></a>
        <a href="#log" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg><span>記録</span></a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap"><p class="muted">読み込み中…</p></main>
  <input type="file" id="file-backup" class="picker" accept="application/json,.json">
  <dialog id="dlg"><button type="button" class="x" aria-label="閉じる">×</button><div id="dlg-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="wrap">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
